<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOVA</title>
<style>
/* NOVA v3 — token semantik; kontras terukur: teks >= 4.5:1, batas kontrol/fokus >= 3:1 (WCAG 2.2). Skala jarak 4/8/12/16/24/32. */
:root{color-scheme:light dark;
 --bg:#f6f7f9;--surface:#ffffff;--surface-2:#eceff4;--text:#1b1f27;--muted:#4b5565;--border:#d5dae3;--border-strong:#79849a;
 --accent:#1a5fd0;--on-accent:#ffffff;--accent-soft:#e3ecfb;--success:#1b6e3f;--warning:#835400;--danger:#b42318;--focus:#1a5fd0;
 --r:12px;--r-sm:8px;--shadow:0 1px 2px #0001,0 4px 16px #0000000d;--rail:264px}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
 --bg:#12151b;--surface:#1a1e26;--surface-2:#232834;--text:#e8ebf1;--muted:#a7b0c0;--border:#2e3543;--border-strong:#7f8aa0;
 --accent:#7db0ff;--on-accent:#0a1a36;--accent-soft:#1d2b45;--success:#62d493;--warning:#f2bb4e;--danger:#ff8f85;--focus:#7db0ff;--shadow:0 1px 2px #0006,0 4px 16px #0004}}
:root[data-theme=dark]{
 --bg:#12151b;--surface:#1a1e26;--surface-2:#232834;--text:#e8ebf1;--muted:#a7b0c0;--border:#2e3543;--border-strong:#7f8aa0;
 --accent:#7db0ff;--on-accent:#0a1a36;--accent-soft:#1d2b45;--success:#62d493;--warning:#f2bb4e;--danger:#ff8f85;--focus:#7db0ff;--shadow:0 1px 2px #0006,0 4px 16px #0004}
/* aksesibilitas: kontras tinggi (>= 7:1) dan teks besar; dipilih lewat tombol di bawah menu */
:root[data-kontras=tinggi]{color-scheme:dark;--bg:#000;--surface:#000;--surface-2:#111;--text:#fff;--muted:#e6e6e6;--border:#fff;--border-strong:#fff;--accent:#ffe14d;--on-accent:#000;--accent-soft:#222;--success:#7dff9e;--warning:#ffd166;--danger:#ff9a90;--focus:#ffe14d}
:root[data-teks=besar] body{font-size:19px}
.a11y{display:flex;gap:6px;margin-top:8px}.a11y button{flex:1;min-height:40px;border-radius:var(--r-sm);border:1px solid var(--border-strong);background:var(--surface);color:var(--text);font:inherit;font-size:14px;cursor:pointer}.a11y button[aria-pressed=true]{background:var(--accent);color:var(--on-accent)}
#wiz{position:fixed;inset:0;background:#000a;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
#wiz .bx{width:min(520px,100%);background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:var(--r);padding:24px;box-shadow:var(--shadow)}
#wiz h2{font-size:22px;margin-bottom:8px}#wiz p,#wiz li{color:var(--muted);line-height:1.6}#wiz ul{padding-left:20px;margin:8px 0}
#wiz .st{font-size:14px;color:var(--muted);margin-bottom:8px}#wiz .ft{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.5 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;display:flex;overflow:hidden;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,h5{margin:0;line-height:1.3}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:var(--r-sm)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
button{font:inherit;color:inherit;cursor:pointer}
kbd{font:12px Consolas,monospace;color:var(--muted);border:1px solid var(--border-strong);border-radius:4px;padding:0 6px;margin-left:auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* rel navigasi */
#rail{width:var(--rail);flex:none;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:12px;padding:16px}
.logo{width:36px;height:36px;flex:none;border-radius:10px}
.brand .t{font-weight:700;font-size:18px;letter-spacing:.02em}.brand .s{font-size:14px;color:var(--muted);line-height:1.3}
#nav{flex:1;min-height:0;overflow-y:auto;padding:4px 12px 12px;display:flex;flex-direction:column;gap:4px}
.nv,.sub-nv,.grp>summary{display:flex;align-items:center;gap:12px;width:100%;min-height:40px;padding:8px 12px;border:0;border-radius:var(--r-sm);background:none;text-align:left;font-size:15px;color:var(--text)}
.nv:hover,.sub-nv:hover,.grp>summary:hover{background:var(--surface-2)}
.nv[aria-current=page]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.ic{width:20px;text-align:center;flex:none}
.grp{margin-top:4px}.grp>summary{cursor:pointer;list-style:none;font-weight:600;color:var(--muted)}
.grp>summary::-webkit-details-marker{display:none}.grp>summary::after{content:"›";margin-left:auto;transition:transform .15s}.grp[open]>summary::after{transform:rotate(90deg)}
.grp h5{margin:12px 12px 4px;font-size:13px;font-weight:600;color:var(--muted)}
.sub-nv{min-height:36px;font-size:14px;padding-left:20px}
.railft{border-top:1px solid var(--border);padding:12px;display:flex;align-items:center;gap:8px}
.seg{display:flex;border:1px solid var(--border-strong);border-radius:var(--r-sm);overflow:hidden;flex:1}
.seg button{flex:1;min-height:36px;border:0;background:none;font-size:14px;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--on-accent);font-weight:600}
.seg button+button{border-left:1px solid var(--border-strong)}
.bell{position:relative;min-width:40px;min-height:40px;border:1px solid var(--border-strong);border-radius:var(--r-sm);background:none}
.badge{position:absolute;top:-6px;right:-6px;background:var(--danger);color:#fff;border-radius:99px;padding:0 6px;font-size:12px;font-weight:700;line-height:18px}
#top{display:none}

/* panggung */
#stage{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
main{flex:1;display:flex;min-height:0;position:relative}
#chat{flex:1;overflow-y:auto;padding:24px max(16px,calc((100% - 760px)/2)) 8px;scroll-behavior:smooth}
.row{display:flex;gap:12px;margin:16px 0;animation:in .2s ease-out}
@keyframes in{from{opacity:0;transform:translateY(4px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
.row.me{justify-content:flex-end}
.av{width:32px;height:32px;flex:none;border-radius:8px;margin-top:2px}
.bub{max-width:min(680px,92%);word-wrap:anywhere;white-space:pre-wrap;line-height:1.6}
.row:not(.me) .bub{background:var(--surface);border:1px solid var(--border);border-radius:4px var(--r) var(--r) var(--r);padding:10px 16px}
.me .bub{background:var(--accent-soft);border:1px solid transparent;border-radius:var(--r) var(--r) 4px var(--r);padding:10px 16px}
.who{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:2px}
.sys{color:var(--muted);font-size:14px;margin:12px 0;white-space:pre-wrap;border-left:3px solid var(--border-strong);padding:2px 0 2px 12px;max-width:72ch}
.bub a,.sys a{color:var(--accent)}
.card{margin:16px 0;padding:16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);max-width:72ch}
.card.bad{border-color:var(--danger);border-width:2px}.card h4{font-size:16px;margin-bottom:8px}
.card code{display:block;background:var(--surface-2);padding:8px 12px;border-radius:var(--r-sm);margin:8px 0;max-height:96px;overflow:auto;white-space:pre-wrap;font:13px Consolas,monospace}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip,.btn{min-height:40px;padding:8px 16px;border:1px solid var(--border-strong);border-radius:var(--r-sm);background:var(--surface);font-size:15px;transition:background .12s}
.chip:hover,.btn:hover{background:var(--surface-2)}
.chip.p,.btn.p{background:var(--accent);color:var(--on-accent);border-color:transparent;font-weight:600}.chip.p:hover,.btn.p:hover{filter:brightness(1.08)}
.chip.d,.btn.d{color:var(--danger);border-color:var(--danger)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
footer{padding:8px max(16px,calc((100% - 760px)/2)) 20px;background:var(--bg)}
.box{display:flex;gap:8px;align-items:flex-end;background:var(--surface);border:1px solid var(--border-strong);border-radius:16px;padding:8px 8px 8px 16px;box-shadow:var(--shadow)}
.box:focus-within{border-color:var(--focus);outline:2px solid var(--focus);outline-offset:0}
textarea{height:40px;min-height:40px;flex:1;background:none;border:0;outline:0;resize:none;color:var(--text);font:inherit;max-height:140px;padding:8px 0}
textarea::placeholder{color:var(--muted)}
.send{min-height:40px;min-width:88px;border:0;border-radius:var(--r-sm);background:var(--accent);color:var(--on-accent);font-weight:600;padding:0 16px}
.send:hover{filter:brightness(1.08)}
.sug{position:absolute;bottom:72px;background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--r);padding:4px;display:none;min-width:260px;box-shadow:var(--shadow)}
.sug div{padding:8px 12px;border-radius:var(--r-sm);cursor:pointer}.sug div:hover,.sug .on{background:var(--surface-2)}
#side,#wd{width:0;overflow:hidden;background:var(--surface);border-left:1px solid var(--border);transition:width .2s}
#side.open{width:320px;padding:16px;overflow:auto}#wd.open{width:340px;padding:16px;overflow:auto}
.n{font-size:14px;color:var(--muted);border-bottom:1px solid var(--border);padding:8px 0}
.dots span{display:inline-block;width:8px;height:8px;margin:0 2px;background:var(--muted);border-radius:50%;animation:b 1.1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{50%{transform:translateY(-4px);opacity:.4}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:var(--text);color:var(--bg);border-radius:var(--r-sm);padding:10px 16px;display:none;max-width:420px;box-shadow:var(--shadow);font-size:15px;z-index:40}
canvas.ch{display:block;width:100%;max-width:480px;height:auto;border-radius:var(--r);margin:12px 0;background:var(--surface-2)}
#term{position:fixed;right:16px;bottom:96px;width:min(440px,92vw);background:#0d1117;border:1px solid #2b3a30;border-radius:var(--r);box-shadow:var(--shadow);z-index:8}
#term .th2{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;color:#9fe0b6;font:13px Consolas,monospace;border-bottom:1px solid #2b3a30}
#term button{background:none;border:0;color:#9fe0b6;font-size:18px;min-width:32px;min-height:32px}
#term pre{margin:0;padding:12px;max-height:200px;overflow:auto;color:#b6ecc8;font:13px/1.5 Consolas,monospace;white-space:pre-wrap}
#omni,#pal{position:fixed;inset:0;background:#0008;display:none;z-index:30;backdrop-filter:blur(3px)}
#omni.open{display:flex;align-items:center;justify-content:center}
#omni .box2{width:min(560px,94vw);background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:24px;box-shadow:var(--shadow)}
#omni label{display:block;margin:12px 0 4px;font-size:14px;font-weight:600}
#omni input,.fi{width:100%;min-height:40px;padding:8px 12px;border-radius:var(--r-sm);border:1px solid var(--border-strong);background:var(--surface);color:var(--text);font:inherit}
#omni .mdl{font-size:14px;color:var(--muted);max-height:150px;overflow:auto}
#pal.open{display:flex;align-items:flex-start;justify-content:center;padding-top:12vh}
#pal .bx{width:min(560px,94vw);background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
#pq{width:100%;padding:16px 20px;border:0;border-bottom:1px solid var(--border);background:none;color:var(--text);font:inherit;font-size:16px;outline:0}
.pi{display:flex;gap:12px;align-items:center;padding:10px 20px;cursor:pointer;font-size:15px}.pi small{margin-left:auto;color:var(--muted)}.pi.on,.pi:hover{background:var(--surface-2)}
.wc{background:var(--surface-2);border-radius:var(--r);padding:16px;margin-bottom:12px}
.wc h4{margin:0 0 12px;font-size:14px;font-weight:600;color:var(--muted)}
.vb{display:flex;align-items:center;gap:12px;font-size:14px;margin:8px 0}.vb span{width:56px;color:var(--muted)}
.vb i{flex:1;height:8px;background:var(--border);border-radius:9px;overflow:hidden}.vb i b{display:block;height:100%;border-radius:9px}
.td{display:flex;align-items:center;gap:12px;padding:6px 0;font-size:15px}.td.dn span{text-decoration:line-through;color:var(--muted)}.td span{flex:1}.td button{background:none;border:0;color:var(--muted);font-size:18px;min-width:32px;min-height:32px}
.td input{accent-color:var(--accent);width:20px;height:20px}
.wi{width:100%;min-height:40px;padding:8px 12px;border-radius:var(--r-sm);border:1px solid var(--border-strong);background:var(--surface);color:var(--text);font:inherit}
.big2{font:600 32px Consolas,monospace;text-align:center;margin:8px 0}
.row2{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.sub{font-size:14px;color:var(--muted)}
.th{display:block;max-width:100%;width:320px;border-radius:var(--r);margin:8px 0 4px}

/* halaman Akun & koneksi */
#kon,#oto{position:absolute;inset:0;background:var(--bg);overflow-y:auto;padding:24px max(16px,calc((100% - 820px)/2)) 48px;z-index:5}
#kon[hidden],#oto[hidden]{display:none}
#kon h2,#oto h2{font-size:24px;margin-bottom:8px}#kon .lead,#oto .lead{color:var(--muted);max-width:60ch;margin:0 0 24px}
.kc{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.kc>header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.kc h3{font-size:18px}.kc p{margin:0 0 12px;color:var(--muted);max-width:62ch}
.badge2{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;padding:2px 10px;border-radius:99px;border:1px solid currentColor}
.badge2.ok{color:var(--success)}.badge2.no{color:var(--muted)}.badge2.warn{color:var(--warning)}
.fld{margin:12px 0;max-width:460px}.fld label{display:block;font-size:14px;font-weight:600;margin-bottom:4px}
.fld .hint{font-size:14px;color:var(--muted);margin-top:4px}
.pw{display:flex;gap:8px}.pw .fi{flex:1}
.msg{margin-top:12px;padding:10px 12px;border-radius:var(--r-sm);font-size:15px;border:1px solid;display:none}
.msg.ok{display:block;color:var(--success);border-color:var(--success)}.msg.err{display:block;color:var(--danger);border-color:var(--danger)}
.acc{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--border)}.acc span{flex:1;min-width:160px;word-break:break-all}
details.how{margin:8px 0}details.how summary{cursor:pointer;color:var(--accent);min-height:32px;display:flex;align-items:center}
details.how ol{margin:8px 0 0 20px;padding:0;color:var(--muted);line-height:1.6}
.sw{display:flex;align-items:center;gap:16px;padding:12px 0;border-top:1px solid var(--border)}.sw:first-of-type{border-top:0}
.sw .tx{flex:1}.sw .tx b{display:block;font-weight:600}.sw .tx span{font-size:14px;color:var(--muted)}
.tg{width:52px;height:32px;flex:none;border-radius:99px;border:2px solid var(--border-strong);background:var(--surface-2);position:relative;padding:0}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:transform .15s}
.tg[aria-checked=true]{background:var(--accent);border-color:var(--accent)}.tg[aria-checked=true]::after{transform:translateX(20px);background:var(--on-accent)}
.steps{list-style:none;margin:12px 0 0;padding:0}.steps li{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--border)}.steps li span.t{flex:1}
.stat{width:24px;text-align:center;font-weight:700}.stat.ok{color:var(--success)}.stat.no{color:var(--muted)}

/* kemajuan pekerjaan bergaya robot: bar bersegmen + persen + langkah + waktu */
#prog{padding:0 max(16px,calc((100% - 760px)/2))}
.pg{margin:0 0 8px;padding:12px 16px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow)}
.pg .pt{display:flex;justify-content:space-between;gap:12px;font-size:15px}.pg .pt span{font:600 14px Consolas,"Cascadia Mono",monospace;color:var(--accent)}
.pg .tr{height:12px;margin:8px 0;border-radius:3px;background:repeating-linear-gradient(90deg,var(--border) 0 10px,transparent 10px 13px)}
.pg .tr i{display:block;height:100%;transition:width .4s;background:repeating-linear-gradient(90deg,var(--accent) 0 10px,transparent 10px 13px)}
.pg.done .tr i{background:repeating-linear-gradient(90deg,var(--success) 0 10px,transparent 10px 13px)}.pg.done .pt span{color:var(--success)}
.pg.bad .tr i{background:repeating-linear-gradient(90deg,var(--danger) 0 10px,transparent 10px 13px)}.pg.bad .pt span{color:var(--danger)}
.pg .pl{font-size:14px;color:var(--muted)}
@media (max-width:840px){
 body{flex-direction:column}#top{display:flex;align-items:center;gap:12px;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--border)}
 #rail{position:fixed;left:0;top:0;bottom:0;z-index:20;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow);width:min(300px,86vw)}
 body.railopen #rail{transform:none}#scrim{display:none;position:fixed;inset:0;background:#0007;z-index:15}body.railopen #scrim{display:block}
 #wd.open,#side.open{position:fixed;right:0;top:0;bottom:0;z-index:20;box-shadow:var(--shadow)}
}
@media (forced-colors:active){.tg,.chip,.btn,.fi,.box{border:1px solid ButtonText}}
</style>
</head>
<body>
<div id="scrim"></div>
<aside id="rail" aria-label="Navigasi utama">
  <div class="brand">
    <svg class="logo" viewBox="0 0 16 16" shape-rendering="crispEdges" role="img" aria-label="Logo NOVA"><rect width="16" height="16" rx="3" fill="#232a3a"/><rect x="3" y="4" width="10" height="8" fill="#8ab4f8"/><rect x="5" y="6" width="2" height="2" fill="#15171c"/><rect x="9" y="6" width="2" height="2" fill="#15171c"/><rect x="7" y="2" width="2" height="2" fill="#e8c47c"/><rect x="6" y="10" width="4" height="1" fill="#15171c"/></svg>
    <div><div class="t">NOVA</div><div class="s" id="status" role="status">menghubungkan…</div></div>
  </div>
  <nav id="nav" aria-label="Menu"></nav>
  <div class="railft">
    <div class="seg" role="group" aria-label="Tema tampilan"><button data-t="auto" aria-pressed="true">Sistem</button><button data-t="light" aria-pressed="false">Terang</button><button data-t="dark" aria-pressed="false">Gelap</button></div>
    <button class="bell" id="bn" title="Notifikasi" aria-label="Notifikasi">🔔<span class="badge" id="nb" style="display:none"></span></button>
    <div class="a11y" role="group" aria-label="Aksesibilitas dan bahasa"><button id="a-k" aria-pressed="false" title="Kontras tinggi">◐ Kontras</button><button id="a-t" aria-pressed="false" title="Teks besar">A+ Teks</button><button id="a-l" aria-pressed="false" title="English interface">EN</button></div>
  </div>
</aside>
<div id="stage">
  <div id="top"><button class="btn" id="burger" aria-label="Buka menu navigasi">☰ Menu</button><b>NOVA</b></div>
  <main>
    <div id="chat" role="log" aria-live="polite" aria-label="Percakapan"></div>
    <section id="kon" hidden aria-label="Akun dan koneksi"></section>
    <section id="oto" hidden aria-label="Otomasi"></section>
    <aside id="wd" aria-label="Widget"></aside>
    <aside id="side" aria-label="Notifikasi"><b>Notifikasi</b><div id="nl"></div></aside>
  </main>
  <div id="prog" aria-live="polite"></div>
  <footer>
    <div style="position:relative"><div class="sug" id="sug"></div></div>
    <div class="box"><label class="sr" for="in">Pesan untuk NOVA</label><span class="sr" id="hint">Ketik / untuk perintah, tekan Ctrl K untuk mencari fitur</span><textarea id="in" rows="1" placeholder="Tulis pesan…" aria-describedby="hint"></textarea><button class="send" id="go">Kirim</button></div>
  </footer>
</div>
<div id="toast" role="status"></div>
<div id="pal" role="dialog" aria-label="Cari fitur"><div class="bx"><input id="pq" placeholder="Cari fitur… (mis. cuaca, catat, harga)" autocomplete="off" aria-label="Cari fitur"><div id="pl"></div></div></div>
<div id="term" hidden><div class="th2"><span>Terminal NOVA</span><button id="tx" title="Tutup" aria-label="Tutup terminal">×</button></div><pre id="tp"></pre></div>

 else if(a==="imap-uji"){KM.imap=await act("imap",{aksi:"imap_uji",label:t.dataset.l});await loadKon()}
 else if(a==="smtp-simpan"){await act("smtp",{aksi:"smtp",host:v("s-host"),user:v("s-user"),pass:v("s-pass")});await loadKon()}
 else if(a==="gemini-simpan"){await act("gemini",{aksi:"gemini_key",key:v("a-key")});await loadKon()}
 else if(a==="gemini-tes"){showView("chat");say("/gemini tes")}
 else if(a==="brave-simpan"){await act("brave",{aksi:"brave_key",key:v("b-key")});await loadKon()}
 else if(a==="google-siapkan"){await act("google",{aksi:"google_siapkan",client_id:v("g-id"),client_secret:v("g-sec")});await loadKon()}
 else if(a==="outlook-siapkan"){await act("outlook",{aksi:"outlook_siapkan",client_id:v("o-id")});await loadKon()}
 else if(a==="google-masuk"){send({Chat:"/google"});KM.google={ok:true,pesan:"Jendela browser akan terbuka. Pilih akun Google Anda, setujui akses baca, lalu kembali ke sini."}}
 else if(a==="outlook-masuk"){send({Chat:"/outlook"});KM.outlook={ok:true,pesan:"Jendela browser akan terbuka. Pilih akun Microsoft Anda, setujui akses baca, lalu kembali ke sini."}}
 else if(a==="omni"){openOmni();return}
 else if(["imap-hapus","google-hapus","outlook-hapus"].includes(a)){
  if(t.dataset.sure!=="1"){t.dataset.sure="1";const old=t.textContent;t.textContent="Putuskan akun ini?";t.setAttribute("aria-live","assertive");setTimeout(()=>{t.dataset.sure="";t.textContent=old},5000);return}
  const id=a.split("-")[0];const m={"imap-hapus":{aksi:"imap_hapus",label:t.dataset.l},"google-hapus":{aksi:"google_hapus",email:t.dataset.l},"outlook-hapus":{aksi:"outlook_hapus",email:t.dataset.l}}[a];
  KM[id==="imap"?"imap":id]=await kapi(m);await loadKon();return}
 if(view==="kon")renderKon()});
// ---------- halaman Otomasi ----------
let OS=null;const OM={};
async function oapi(o){try{const r=await fetch("/api/otomasi",{method:"POST",headers:{"x-nova-token":TOKEN,"content-type":"application/json"},body:JSON.stringify(o)});return await r.json()}catch(e){return{ok:false,pesan:"Tidak bisa menghubungi NOVA."}}}
async function loadOto(){try{OS=await (await fetch("/api/otomasi",{headers:{"x-nova-token":TOKEN}})).json()}catch(e){$("#oto").innerHTML='<h2>Otomasi</h2><div class="msg err" role="alert">Tidak bisa memuat otomasi. Coba lagi sebentar lagi.</div>';return}renderOto()}
function renderOto(){const s=OS;if(!s)return;
 const ter=t=>t?`<small class="sub">Terakhir: ${esc((t.waktu||"").slice(5,16).replace("T"," "))} · ${t.status==="gagal"?"✖ gagal":t.status==="ok"?"✔ ok":"⏳ sebagian"} · ${t.detik} dtk</small>`:`<small class="sub">Belum pernah jalan</small>`;
 const mnt=s.menunggu.map(m=>`<div class="acc"><span><b>${esc(m.sumber)}</b> ingin menjalankan <code>${esc(m.alat)} ${esc(m.arg)}</code><br><small class="sub">${esc(m.alasan)}</small></span><button class="btn" data-a="izinkan" data-id="${m.id}">Izinkan</button><button class="btn d" data-a="tolak" data-id="${m.id}">Tolak</button></div>`).join("");
 const tg=s.tugas.map(t=>`<div class="acc"><span><b>${esc(t.nama)}</b> <span class="badge2 ${t.status==="Disabled"?"warn":"ok"}">${t.status==="Disabled"?"mati":t.status==="Running"?"jalan":t.status==="Ready"?"siap":esc(t.status)}</span><br><small class="sub">${esc(t.jadwal)}${t.berikutnya?` · berikutnya ${esc(t.berikutnya)}`:""}</small><br><small class="sub">${esc(t.langkah.join(" → "))}</small><br>${ter(t.terakhir)}</span>
  ${["harian","mingguan","sekali"].includes(t.tipe)?`<input class="fi" style="width:100px" type="time" id="jam-${t.id}" value="${esc(t.jam)}" aria-label="Jam ${esc(t.nama)}"><button class="btn" data-a="tugas_jam" data-id="${t.id}">Ubah jam</button>`:""}
  <button class="btn" data-a="tugas_jalankan" data-id="${t.id}">Jalankan</button><button class="btn" data-a="${t.status==="Disabled"?"tugas_aktif":"tugas_nonaktif"}" data-id="${t.id}">${t.status==="Disabled"?"Aktifkan":"Matikan"}</button><button class="btn d" data-a="tugas_hapus" data-id="${t.id}">Hapus</button></div>`).join("");
 const pm=s.pemicu.map(p=>`<div class="acc"><span><b>${esc(p.nama)}</b> <span class="badge2 ${p.aktif?"ok":"no"}">${p.aktif?"aktif":"mati"}</span><br><small class="sub">Bila ${esc(p.kejadian)}${esc(p.syarat)} · jeda ${p.cooldown} menit</small><br><small class="sub">${esc(p.langkah.join(" → "))}</small><br>${ter(p.terakhir)}</span>
  <button class="btn" data-a="${p.aktif?"pemicu_nonaktif":"pemicu_aktif"}" data-id="${p.id}">${p.aktif?"Matikan":"Aktifkan"}</button><button class="btn d" data-a="pemicu_hapus" data-id="${p.id}">Hapus</button></div>`).join("");
 const tp=(arr,a)=>arr.map(t=>`<button class="btn" data-a="${a}" data-nomor="${t.nomor}" title="${esc(t.ringkas)}">${esc(t.nama)}</button>`).join(" ");
 $("#oto").innerHTML=`<h2>Otomasi</h2><p class="lead">Tugas terjadwal dan pemicu yang bekerja untuk Anda. Langkah yang berisiko tidak jalan sendiri: NOVA meminta izin Anda dulu. Untuk membuat yang baru, tulis di obrolan, mis. <i>jadwalkan setiap hari kerja jam 08:00 tampilkan cuaca</i> atau <i>kalau baterai di bawah 15% ingatkan aku</i>.</p>
 ${OM.x?`<div class="msg ${OM.x.ok?"ok":"err"}" role="${OM.x.ok?"status":"alert"}">${esc(OM.x.pesan)}</div>`:""}
 ${s.menunggu.length?`<div class="kc"><header><h3>Menunggu izin Anda</h3><span class="badge2 warn">${s.menunggu.length}</span></header>${mnt}</div>`:""}
 <div class="kc"><header><h3>Tugas terjadwal</h3></header>${tg||'<p>Belum ada tugas terjadwal.</p>'}<p style="margin-top:12px">Dari templat: ${tp(s.templat,"templat_tugas")}</p></div>
 <div class="kc"><header><h3>Pemicu</h3></header>${pm||'<p>Belum ada pemicu.</p>'}<p style="margin-top:12px">Dari templat: ${tp(s.pemicu_templat,"templat_pemicu")}</p></div>
 <div class="kc"><header><h3>Mulai otomatis</h3></header>${sw("mulai_otomatis","NOVA menyala saat Windows dimulai","Lewat Task Scheduler; dihidupkan lagi bila berhenti karena galat.",s.mulai_otomatis)}</div>`}
document.addEventListener("click",async e=>{const t=e.target.closest("#oto button");if(!t)return;
 const a=t.dataset.a||(t.dataset.tg?"mulai_otomatis":"");if(!a)return;
 if(["tugas_hapus","pemicu_hapus"].includes(a)&&t.dataset.sure!=="1"){t.dataset.sure="1";const old=t.textContent;t.textContent="Yakin hapus?";setTimeout(()=>{t.dataset.sure="";t.textContent=old},5000);return}
 const o={aksi:a,id:+t.dataset.id||0,nomor:+t.dataset.nomor||0};
 if(a==="tugas_jam")o.jam=(document.getElementById("jam-"+t.dataset.id)||{}).value||"";
 if(a==="mulai_otomatis")o.aktif=t.getAttribute("aria-checked")!=="true";
 t.disabled=true;OM.x=await oapi(o);await loadOto()});
poll();inp.focus();wizard();
</script>
